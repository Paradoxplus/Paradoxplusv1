server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      youtube: false
      soundcloud: true # Use Lavalink built-in SoundCloud source.
      bandcamp: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    bufferDurationMs: 400
    frameBufferDurationMs: 5000

logging:
  level:
    root: INFO
    lavalink: DEBUG
    com.sedmelluq.discord.lavaplayer.tools.ExceptionTools: DEBUG
