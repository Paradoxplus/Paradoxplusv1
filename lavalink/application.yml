server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

lavalink:
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      youtube: false
      soundcloud: false
      bandcamp: true # Use Lavalink built-in Bandcamp source.
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    bufferDurationMs: 400
    frameBufferDurationMs: 5000

logging:
  level:
    root: INFO
    lavalink: DEBUG
    com.sedmelluq.discord.lavaplayer.tools.ExceptionTools: DEBUG
