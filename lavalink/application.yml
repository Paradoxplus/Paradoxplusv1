server:
  port: ${SERVER_PORT:2333}
  address: 0.0.0.0

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - ANDROID_MUSIC
      - ANDROID_VR
      - MWEB
      - TVHTML5_SIMPLY
      - WEB
      - WEBEMBEDDED
      - MUSIC
    oauth:
      enabled: true
      refreshToken: ${YOUTUBE_OAUTH_TOKEN}

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: ${LAVALINK_SERVER_PASSWORD}
    sources:
      youtube: false # Use the maintained youtube-source plugin.
      soundcloud: false # Replaced by Paradoxplus SoundCloud source plugin.
      bandcamp: false
      twitch: false
      vimeo: false
      nico: false
      http: false
      local: false
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: true
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: false
      rotation: false
      channelMix: false
      lowPass: false
    opusEncodingQuality: 10
    resamplingQuality: HIGH
    bufferDurationMs: 400
    frameBufferDurationMs: 5000

logging:
  level:
    root: INFO
    lavalink: DEBUG
    dev.lavalink.youtube: DEBUG
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
    com.sedmelluq.discord.lavaplayer.tools.ExceptionTools: DEBUG
