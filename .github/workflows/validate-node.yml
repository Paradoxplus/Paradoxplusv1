name: Validate Node.js syntax

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/railway-primary-failback]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check recruitment.js
